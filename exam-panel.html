<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Exam Panel</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --primary:#019797;
  --secondary:#009999;
  --bg:#f7f7f7;
  --card:#fff;
  --success:#28a745;
  --danger:#dc3545;
}
body{
  margin:0;
  font-family: 'Inter', sans-serif;
  background: linear-gradient(135deg,#e0f7f7,#ffffff);
}
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 30px;
  background: var(--primary);
  color:white;
  font-weight:bold;
  position: sticky;
  top:0;
  z-index: 100;
}
header button{
  background:#fff;
  color: var(--primary);
  border:none;
  border-radius:10px;
  padding:7px 15px;
  cursor:pointer;
  font-weight:bold;
}
main{
  max-width:850px;
  margin:30px auto;
  background: var(--card);
  border-radius:15px;
  padding:30px;
  box-shadow:0 6px 25px rgba(0,0,0,0.1);
  position:relative;
  animation: fadeIn 0.5s;
}
h2{
  text-align:center;
  margin-bottom:25px;
  color: var(--primary);
}
#progressContainer{
  margin-bottom:20px;
}
#progressPercent{
  text-align:right;
  font-weight:bold;
  margin-bottom:5px;
}
#progressBarContainer{
  height:20px;
  background:#ddd;
  border-radius:10px;
  overflow:hidden;
}
#progressBar{
  height:100%;
  width:0%;
  background: var(--secondary);
  transition:0.3s;
}
#questionContainer{
  animation: fadeIn 0.4s;
  margin-bottom:20px;
}
#questionContainer h3{
  font-size:18px;
  margin-bottom:15px;
}
.options{
  display:flex;
  flex-direction:column;
  gap:10px;
  margin-bottom:20px;
}
button.navBtn{
  padding:10px 20px;
  margin-right:10px;
  border:none;
  border-radius:10px;
  background: var(--primary);
  color:white;
  cursor:pointer;
  transition:0.2s;
  font-weight:bold;
}
button.navBtn:hover{
  background: var(--secondary);
}
#examComplete{
  display:none;
  text-align:center;
  padding:30px;
  border-radius:15px;
  background: linear-gradient(135deg,#e0f7f7,#ffffff);
  box-shadow:0 6px 25px rgba(0,0,0,0.1);
  animation: fadeIn 1s;
}
#examComplete h3{
  color: var(--success);
  margin-bottom:15px;
  font-size:28px;
}
#scoreBox{
  background: var(--primary);
  color:white;
  display:inline-block;
  padding:15px 25px;
  border-radius:12px;
  font-weight:bold;
  margin-bottom:20px;
}
#downloadPDF{
  padding:12px 25px;
  border:none;
  border-radius:10px;
  background: var(--primary);
  color:white;
  cursor:pointer;
  font-size:16px;
}
#downloadPDF:hover{
  background: var(--secondary);
}
.checkmark{
  font-size:50px;
  color: var(--success);
  animation: pop 0.6s;
}
@keyframes pop{
  0%{transform:scale(0);}
  70%{transform:scale(1.2);}
  100%{transform:scale(1);}
}
@keyframes fadeIn{0%{opacity:0;transform:translateY(10px);}100%{opacity:1;transform:translateY(0);}}
@media(max-width:600px){
  main{padding:20px;}
  button.navBtn{width:100%; margin-bottom:10px;}
}
</style>
</head>
<body>

<header>
  <span id="studentName"></span>
  <button onclick="logout()">Logout</button>
</header>

<main>
  <h2>Exam Panel</h2>
  <div id="progressContainer">
    <div id="progressPercent">Progress: 0%</div>
    <div id="progressBarContainer"><div id="progressBar"></div></div>
  </div>

  <div id="questionContainer"></div>

  <div style="text-align:right;">
    <button id="prevBtn" class="navBtn" onclick="prevQuestion()">Previous</button>
    <button id="nextBtn" class="navBtn" onclick="nextQuestion()">Next</button>
  </div>

  <div id="examComplete">
    <div class="checkmark">✔️</div>
    <h3>Exam Completed!</h3>
    <div id="scoreBox"></div>
    <button id="downloadPDF" onclick="downloadCertificate()">Download PDF Certificate</button>
  </div>
</main>

<script>
let student = JSON.parse(localStorage.getItem('loggedStudent'));
if(!student){
  alert('Please login first!');
  window.location.href='index.html';
}
document.getElementById('studentName').innerText=student.firstName+' '+student.lastName;

let exams = JSON.parse(localStorage.getItem('exams')) || [];
let exam = exams.find(e=>e.id==student.assignedExam);
if(!exam){
  document.getElementById('questionContainer').innerHTML='<h3>No exam assigned</h3>';
}

let questions = exam.questions;
let currentQuestion = 0;
let userAnswers = [];

function renderQuestion(){
  let q = questions[currentQuestion];
  let html = `<h3>Q${currentQuestion+1}: ${q.text} ${q.marks===0?'(Info)': ''}</h3>`;
  if(q.type==='mcq'){
    html += '<div class="options">';
    ['A','B','C','D'].forEach(opt=>{
      if(q[opt]) html+=`<label><input type="radio" name="answer" value="${opt}" ${userAnswers[currentQuestion]===opt?'checked':''}> ${opt}. ${q[opt]}</label>`;
    });
    html+='</div>';
  } else if(q.type==='short'||q.type==='long'){
    html+=`<input type="text" id="textAnswer" value="${userAnswers[currentQuestion]||''}" placeholder="Your answer" style="width:100%;padding:10px;border-radius:8px;border:1px solid #ccc;margin-bottom:20px;">`;
  }
  document.getElementById('questionContainer').innerHTML=html;

  document.getElementById('prevBtn').style.display=currentQuestion===0?'none':'inline-block';
  document.getElementById('nextBtn').innerText=currentQuestion===questions.length-1?'Submit':'Next';

  updateProgress();
}

function updateProgress(){
  let total = questions.filter(q=>q.marks>0).length;
  let done = userAnswers.filter((a,i)=>questions[i].marks>0 && a).length;
  let percent = total? Math.round((done/total)*100) :0;
  document.getElementById('progressPercent').innerText='Progress: '+percent+'%';
  document.getElementById('progressBar').style.width=percent+'%';
}

function prevQuestion(){
  if(currentQuestion>0) currentQuestion--;
  renderQuestion();
}

function nextQuestion(){
  let q = questions[currentQuestion];
  let answer=null;
  if(q.type==='mcq'){
    let selected = document.querySelector('input[name="answer"]:checked');
    if(q.marks>0 && !selected){ alert('Please select an answer!'); return;}
    answer = selected?.value || '';
  } else {
    let val = document.getElementById('textAnswer')?.value.trim();
    if(q.marks>0 && !val){ alert('Please enter an answer!'); return;}
    answer = val || '';
  }
  userAnswers[currentQuestion]=answer;

  if(currentQuestion===questions.length-1){
    updateProgress();
    showResult();
    return;
  }

  currentQuestion++;
  renderQuestion();
}

function showResult(){
  let correct=0, wrong=0;
  questions.forEach((q,i)=>{
    if(q.marks===0) return;
    if(q.type==='mcq' && q.correct===userAnswers[i]) correct++;
    else if(q.type!=='mcq' && userAnswers[i]) correct++;
    else wrong++;
  });

  const totalMarks = questions.filter(q=>q.marks>0).length;
  document.getElementById('scoreBox').innerHTML=`Correct: ${correct} | Wrong: ${wrong} | Total: ${totalMarks}`;

  document.getElementById('questionContainer').style.display='none';
  document.getElementById('progressContainer').style.display='none';
  document.getElementById('prevBtn').style.display='none';
  document.getElementById('nextBtn').style.display='none';
  document.getElementById('examComplete').style.display='block';
}
function downloadCertificate() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF('p','pt','a4');
  const pageWidth = doc.internal.pageSize.getWidth();
  const pageHeight = doc.internal.pageSize.getHeight();
  const borderPadding = 40; // border space
  const textPadding = 20;   // inner padding from border

  // Draw border
  doc.setDrawColor(1,151,151); // #019797
  doc.setLineWidth(4);
  doc.rect(borderPadding, borderPadding, pageWidth - 2*borderPadding, pageHeight - 2*borderPadding);

  // Add watermark logo
  const img = new Image();
  img.src = 'logo.png';
  img.onload = () => {
    doc.setGState(new doc.GState({opacity:0.15}));
    const w = 200, h = 200;
    doc.addImage(img, 'PNG', (pageWidth - w)/2, (pageHeight - h)/2, w, h);
    doc.setGState(new doc.GState({opacity:1}));

    let currentY = borderPadding + textPadding + 40; // added extra 40px padding above the title

// Certificate Title
doc.setFontSize(28);
doc.setFont('helvetica','bold');
doc.setTextColor(1,151,151);
doc.text('Certificate of Completion', pageWidth/2, currentY, {align:'center'});

currentY += 50; 
    // Intro text
    doc.setFontSize(14);
    doc.setFont('helvetica','normal');
    doc.setTextColor(0,0,0);
    const introText = `This certificate is proudly presented to`;
    doc.text(introText, pageWidth/2, currentY, {align:'center'});

    currentY += 30;

    // Student Name
    doc.setFontSize(22);
    doc.setFont('helvetica','bold');
    doc.text(`${student.firstName} ${student.lastName}`, pageWidth/2, currentY, {align:'center'});

    currentY += 30;

    // Achievement paragraph
    doc.setFontSize(13);
    doc.setFont('helvetica','normal');
    const achievement = `for successfully completing the HTML Final Examination and demonstrating exceptional knowledge, skill, and dedication in the subject.

Through remarkable commitment, perseverance, and excellence, ${student.firstName} ${student.lastName} has shown a profound understanding of HTML concepts, best practices, and practical application. This achievement reflects not only mastery of the material but also a passion for learning and a dedication to professional growth in the field of web development.`;
    const achievementLines = doc.splitTextToSize(achievement, pageWidth - 2*(borderPadding+textPadding));
    doc.text(achievementLines, pageWidth/2, currentY, {align:'center'});

    currentY += achievementLines.length * 18 + 10;

    // Exam details
    const correctCount = userAnswers.filter((a,i)=>questions[i].marks>0 && ((questions[i].type==='mcq' && questions[i].correct===a) || (questions[i].type!=='mcq' && a))).length;
    const totalCount = questions.filter(q=>q.marks>0).length;
    const wrongCount = totalCount - correctCount;

    const examDetails = `Examination Details:

Exam: ${exam.title}
Score: ${correctCount} / ${totalCount}
Correct Answers: ${correctCount}
Incorrect Answers: ${wrongCount}
Date: ${new Date().toLocaleDateString()}`;
    const examLines = doc.splitTextToSize(examDetails, pageWidth - 2*(borderPadding+textPadding));
    doc.text(examLines, pageWidth/2, currentY, {align:'center'});

    currentY += examLines.length * 18 + 10;

    // Closing paragraph
    const closing = `We hereby acknowledge this accomplishment and celebrate the outstanding performance in web development fundamentals. Your diligence, analytical skills, and consistent effort are commendable and serve as an inspiration for peers.

Congratulations on this success, and we encourage you to continue pursuing excellence and innovation in all your future endeavors.`;
    const closingLines = doc.splitTextToSize(closing, pageWidth - 2*(borderPadding+textPadding));
    doc.text(closingLines, pageWidth/2, currentY, {align:'center'});

    // Signature
    const sigY = pageHeight - borderPadding - 60;
    doc.setFontSize(18);
    doc.setFont('times','italic');
    doc.text('Muhammad Awais', pageWidth/2, sigY, {align:'center'}); // Signature
    doc.setLineWidth(1.5);
    doc.line(pageWidth/2 - 100, sigY + 10, pageWidth/2 + 100, sigY + 10); // Signature line
    doc.setFontSize(12);
    doc.setFont('helvetica','normal');
    doc.text('Authorized Signature', pageWidth/2, sigY + 25, {align:'center'});

    doc.save(`${student.firstName}_${exam.title}_Certificate.pdf`);
  };
}


function logout(){
  localStorage.removeItem('loggedStudent');
  window.location.href='index.html';
}

renderQuestion();
</script>
</body>
</html>
