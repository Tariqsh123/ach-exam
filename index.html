<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Achievers' Corner — Login</title>
  <style>
    :root {
      --bg: #ffffff;
      --card: #f7f7f7;
      --accent: #00cccc;
      --accent2: #009999;
      --text: #000000;
      --muted: #555555;
      font-family: 'Inter', sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; overflow: hidden; }
    body {
      background: linear-gradient(135deg, #ffffff, #e0f7f7);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
      padding: 20px;
      position: relative;
    }
    .bgCircle {
      position: absolute;
      border-radius: 50%;
      background: var(--accent);
      opacity: 0.1;
      animation: moveCircle 12s linear infinite alternate;
    }
    .bgCircle:nth-child(1) { width: 250px; height: 250px; top: -60px; left: -60px; }
    .bgCircle:nth-child(2) { width: 180px; height: 180px; bottom: -50px; right: -50px; }
    .bgCircle:nth-child(3) { width: 150px; height: 150px; top: 30%; left: 70%; }
    @keyframes moveCircle {
      0% {transform: translate(0,0) rotate(0deg);}
      100% {transform: translate(40px,40px) rotate(360deg);}
    }
    .container {
      width: 100%;
      max-width: 450px;
      background: var(--card);
      border-radius: 25px;
      padding: 50px 35px;
      text-align: center;
      position: relative;
      overflow: hidden;
      animation: fadeIn 1s ease forwards;
      box-shadow: 0 10px 25px gray;
    }
    .container h1 {
      margin-bottom: 10px;
      font-size: 32px;
      color: var(--accent);
      animation: slideIn 1s ease forwards;
    }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 14px 15px;
      margin-bottom: 20px;
      border-radius: 12px;
      border: 1px solid #cccccc;
      background: #ffffff;
      color: var(--text);
      font-size: 15px;
      outline: none;
      transition: 0.2s;
      animation: fadeIn 1.4s ease forwards;
    }
    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 10px rgba(0,204,204,0.3);
      transform: scale(1.02);
    }
    button {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      border: none;
      border-radius: 15px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      color: #ffffff;
      cursor: pointer;
      transition: 0.3s;
      animation: fadeIn 1.6s ease forwards;
    }
    button:hover { transform: scale(1.01); }

    @keyframes fadeIn { 0% {opacity:0;} 100% {opacity:1;} }
    @keyframes slideIn { 0% {opacity:0; transform: translateY(-20px);} 100% {opacity:1; transform: translateY(0);} }
  </style>
</head>
<body>
  <div class="bgCircle"></div>
  <div class="bgCircle"></div>
  <div class="bgCircle"></div>

  <div class="container">
    <h1>Login Form</h1>
    <form id="loginForm">
      <input type="text" id="username" placeholder="Username / ID" required>
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();

      // Admin login
      if(username === 'admin' && password === 'admin'){
        window.location.href = 'admin.html';
        return;
      }

      // Teacher login
      const teachers = JSON.parse(localStorage.getItem('teachers')) || [];
      const teacher = teachers.find(t => t.id === username && t.password === password);
      if(teacher){
        localStorage.setItem('loggedTeacher', JSON.stringify(teacher));
        window.location.href = 'teacher-panel.html';
        return;
      }

      // Student login
      const students = JSON.parse(localStorage.getItem('students')) || [];
      const student = students.find(s => s.id.toString() === username && s.password === password);
      if(student){
        localStorage.setItem('loggedStudent', JSON.stringify(student));
        window.location.href = 'exam-panel.html';
        return;
      }

      alert('Invalid credentials');
    });
  </script>
</body>
</html>
