<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Dashboard - Achievers' Corner</title>
<style>
:root {
  --bg: #ffffff;
  --card: #f7f7f7;
  --accent: #019797;
  --accent2: #016a6a;
  --text: #000000;
  --muted: #555555;
  font-family: 'Inter', sans-serif;
}
* { box-sizing: border-box; }

body {
  margin:0;
  font-family:'Inter',sans-serif;
  background: linear-gradient(135deg,#e0f7f7,#ffffff);
  overflow-x:hidden;
}

.dashboard {
  display:flex;
  height:100vh;
  transition:0.3s;
}

.sidebar {
  width:220px;
  background: var(--accent);
  color:#fff;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  box-shadow: 3px 0 10px rgba(0,0,0,0.1);
  transition:0.3s;
  position:relative;
  z-index:100;
}

.sidebar h2 {
  text-align:center;
  padding:20px 0;
  margin:0;
  border-bottom:1px solid rgba(255,255,255,0.3);
  font-size:16px;
}

.sidebar a, .sidebar button {
  padding:15px 20px;
  color:#fff;
  text-decoration:none;
  border:none;
  border-bottom:1px solid rgba(255,255,255,0.1);
  cursor:pointer;
  background:none;
  font-size:14px;
  white-space:nowrap;
  display:flex;
  align-items:center;
  transition:0.3s;
}

.sidebar a.active, .sidebar a:hover, .sidebar button:hover {
  background: var(--accent2);
}

.sidebar .logout {
  margin-top:auto;
  background:red;
  text-align:center;
  border-radius:0;
  font-size:14px;
  padding:10px;
}

.sidebar .logout:hover {
  background:darkred;
}

.toggle-btn {
  display:none;
  position:absolute;
  top:15px;
  right:-50px;
  background: var(--accent2);
  color:#fff;
  border:none;
  border-radius:8px;
  padding:5px;
  cursor:pointer;
  z-index:101;
  font-size:18px;
}

.content {
  flex:1;
  padding:20px;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  transition:0.3s;
}

/* Buttons */
button {
  padding:10px 15px;
  border:none;
  border-radius:12px;
  background: var(--accent);
  color:#fff;
  cursor:pointer;
  transition:0.3s;
  margin:5px 0;
}
button:hover {
  transform: scale(1);
  background: var(--accent2);
}

/* Table styling */
.table-container {
  margin-top:15px;
  background: #fff;
  padding:10px;
  border-radius:12px;
  box-shadow:0 4px 15px rgba(0,0,0,0.1);
  overflow:auto;
}

table {
  width:100%;
  border-collapse:collapse;
  table-layout:fixed;
  word-wrap:break-word;
  font-size:14px;
}

th, td {
  padding:10px 12px;
  border-bottom:1px solid #ddd;
  text-align:left;
}

th {
  background:#f7f7f7;
  color: var(--accent);
  font-weight:600;
}

tr:hover {
  background:#e0f7f7;
}

/* Modal styling */
.modal {
  display:none;
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:rgba(0,0,0,0.5);
  justify-content:center;
  align-items:center;
  z-index:1000;
  overflow:auto;
}

.modal-content {
  background:#fff;
  padding:20px;
  border-radius:15px;
  width:90%;
  max-width:500px;
  max-height:90%;
  overflow-y:auto;
  position:relative;
  box-shadow:0 8px 20px rgba(0,0,0,0.2);
}

.modal-content h3 {
  margin-top:0;
  color: var(--accent2);
  font-size:16px;
}

.close {
  position:absolute;
  top:10px;
  right:10px;
  cursor:pointer;
  font-size:18px;
  color:#333;
  transition:0.3s;
}
.close:hover {
  color: var(--accent);
  transform: scale(1.2);
}

/* Form styling */
.form-group {
  margin-bottom:12px;
}
.form-group label {
  display:block;
  margin-bottom:5px;
  color: var(--accent2);
  font-size:12px;
}
.form-group input {
  width:100%;
  padding:8px;
  border-radius:6px;
  border:1px solid #ccc;
  font-size:12px;
}

/* Responsive */
@media(max-width:768px){
  .dashboard { flex-direction:column; }
  .sidebar { position:fixed; left:-220px; top:0; height:100%; transition:0.3s; }
  .sidebar.show { left:0; }
  .toggle-btn { display:block; position: absolute;top: 5px;right: 20px;}
  .content { margin-left:0; padding:10px; }
  .table-container { max-height:60vh; }
  table { display:block; overflow-x:auto; white-space: nowrap; }
}
@media(max-width:480px){
  .sidebar a, .sidebar button { font-size:14px; padding:10px; }
  .content { padding:60px 10px 10px 10px; }
  input, textarea, select { padding:8px; }
  button { padding:8px 12px; font-size:12px; }
  th, td { padding:8px; font-size:12px; }
}
</style>
</head>
<body>
<div class="dashboard">
  <div class="sidebar" id="sidebar">
    <h2>Admin Panel</h2>
    <a class="active" onclick="showSection('addTeacher', event)">Add Teachers</a>
    <a onclick="showSection('allExams', event)">All Exams</a>
    <a onclick="showSection('studentResults', event)">Student Results</a>
    <a onclick="showSection('studentsDetails', event)">Students Details</a>
    <a class="logout" onclick="logout()">Logout</a>
  </div>
  <button class="toggle-btn" onclick="toggleSidebar()">☰</button>

  <div class="content">
    <!-- Add Teachers -->
    <div id="addTeacher">
      <button onclick="openAddTeacherModal()">Teacher +</button>
      <div class="table-container">
        <table>
          <thead><tr><th>ID</th><th>Name</th><th>Date</th><th>Password</th><th>Action</th></tr></thead>
          <tbody id="teacherTableBody"></tbody>
        </table>
      </div>
    </div>

    <!-- All Exams -->
    <div id="allExams" style="display:none;">
      <button onclick="renderExams()">Refresh Exams</button>
      <div class="table-container">
        <table>
          <thead>
            <tr><th>Title</th><th>Subject</th><th>Description</th><th>Questions</th><th>Teacher</th></tr>
          </thead>
          <tbody id="examTableBody"></tbody>
        </table>
      </div>
    </div>

    <!-- Student Results -->
    <div id="studentResults" style="display:none;">
      <p>No student results yet.</p>
    </div>

    <!-- Students Details -->
<div id="studentsDetails" style="display:none;">
  <h3>Students Details</h3>
  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>First Name</th>
          <th>Last Name</th>
          <th>Batch</th>
          <th>Password</th>
          <th>Assigned Exam</th>
          <th>Teacher Name</th> <!-- NEW COLUMN -->
        </tr>
      </thead>
      <tbody id="studentsTableBody"></tbody>
    </table>
  </div>
</div>


<!-- Add Teacher Modal -->
<div id="teacherModal" class="modal" onclick="if(event.target==this) closeModal()">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">&times;</span>
    <h3>Add Teacher</h3>
    <div class="form-group"><label>First Name</label><input type="text" id="firstName"></div>
    <div class="form-group"><label>Last Name</label><input type="text" id="lastName"></div>
    <button onclick="addTeacherFromForm()">Add Teacher</button>
  </div>
</div>

<!-- View Teacher Modal -->
<div id="viewTeacherModal" class="modal" onclick="if(event.target==this) closeViewModal()">
  <div class="modal-content">
    <span class="close" onclick="closeViewModal()">&times;</span>
    <h3>Teacher Details</h3>
    <p id="teacherDetails"></p>
  </div>
</div>

<script>
let sidebar = document.getElementById('sidebar');
function toggleSidebar(){ sidebar.classList.toggle('show'); }

function showSection(section, event){
  ['addTeacher','allExams','studentResults','studentsDetails'].forEach(s => 
    document.getElementById(s).style.display = 'none'
  );
  document.getElementById(section).style.display = 'block';
  document.querySelectorAll('.sidebar a').forEach(a=>a.classList.remove('active'));
  if(event) event.target.classList.add('active');
  if(window.innerWidth<=768) toggleSidebar();

  if(section==='studentsDetails') renderStudents();
}

let teachers = JSON.parse(localStorage.getItem('teachers')) || [];
let selectedTeacher = null;

function saveTeachers(){ localStorage.setItem('teachers', JSON.stringify(teachers)); }

function openAddTeacherModal(){ 
  document.getElementById('firstName').value=''; 
  document.getElementById('lastName').value=''; 
  document.getElementById('teacherModal').style.display='flex'; 
}
function closeModal(){ document.getElementById('teacherModal').style.display='none'; }

function addTeacherFromForm(){
  const firstName = document.getElementById('firstName').value.trim();
  const lastName = document.getElementById('lastName').value.trim();
  if(!firstName || !lastName){ alert('Enter both names'); return; }

  // ID as First+Last+3 digit random
  const randomNum = Math.floor(100 + Math.random() * 900);
  const id = firstName + lastName + randomNum;

  const date = new Date().toISOString().split('T')[0];
  const password = Math.random().toString(36).substring(2,8);
  const nextUpdate = new Date().getTime() + 7*24*60*60*1000;

  teachers.push({id, name:firstName+' '+lastName, date, password, nextUpdate});
  saveTeachers();
  renderTeachers();
  closeModal();
}

function renderTeachers(){
  const tbody=document.getElementById('teacherTableBody');
  tbody.innerHTML='';
  const now = new Date().getTime();
  teachers.forEach(t=>{
    if(now > t.nextUpdate){ 
      t.password=Math.random().toString(36).substring(2,8); 
      t.nextUpdate = now + 7*24*60*60*1000; 
    }
    const tr=document.createElement('tr');
    tr.innerHTML=`<td>${t.id}</td><td>${t.name}</td><td>${t.date}</td><td>${t.password}</td><td><button onclick='viewTeacher("${t.id}")'>View</button></td>`;
    tbody.appendChild(tr);
  });
  saveTeachers();
}

function viewTeacher(id){
  selectedTeacher = teachers.find(t => t.id == id);
  if(!selectedTeacher) return;

  const nextUpdateDate = new Date(selectedTeacher.nextUpdate);
  document.getElementById('teacherDetails').innerHTML = `
    <strong>ID:</strong> ${selectedTeacher.id}<br>
    <strong>Name:</strong> ${selectedTeacher.name}<br>
    <strong>Date Created:</strong> ${selectedTeacher.date}<br>
    <strong>Password:</strong> ${selectedTeacher.password}<br>
    <strong>Next Password Update:</strong> ${nextUpdateDate.toLocaleString()}
  `;
  document.getElementById('viewTeacherModal').style.display='flex';
}
function closeViewModal(){ document.getElementById('viewTeacherModal').style.display='none'; }

function logout(){ window.location.href='index.html'; }

function renderExams(){
  const tbody = document.getElementById('examTableBody');
  tbody.innerHTML='';
  const exams = JSON.parse(localStorage.getItem('exams')) || [];
  if(exams.length===0){ tbody.innerHTML='<tr><td colspan="5">No exams</td></tr>'; return; }
  exams.forEach(ex=>{
    const teacher = teachers.find(t=>t.id===ex.teacherId);
    const tr = document.createElement('tr');
    tr.innerHTML=`<td>${ex.title}</td><td>${ex.subject}</td><td>${ex.desc||''}</td><td>${ex.questions?ex.questions.length:0}</td><td>${teacher?teacher.name:'Deleted'}</td>`;
    tbody.appendChild(tr);
  });
}

function renderStudents(){
  const tbody = document.getElementById('studentsTableBody');
  tbody.innerHTML = '';
  const students = JSON.parse(localStorage.getItem('students')) || [];
  const exams = JSON.parse(localStorage.getItem('exams')) || [];

  if(students.length === 0){
    tbody.innerHTML = '<tr><td colspan="7">No students assigned</td></tr>';
    return;
  }

  students.forEach(s => {
    // Get exam ID: prefer 'examId', fallback to 'assignedExam'
    const examId = s.examId || s.assignedExam;
    const ex = exams.find(e => e.id == examId); // match string/number
    const teacher = ex ? teachers.find(t => t.id === ex.teacherId) : null;

    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${s.id}</td>
      <td>${s.firstName}</td>
      <td>${s.lastName}</td>
      <td>${s.batch}</td>
      <td>${s.password}</td>
      <td>${ex ? ex.title : s.assignedExamName || 'N/A'}</td>
      <td>${teacher ? teacher.name : 'N/A'}</td>
    `;
    tbody.appendChild(tr);
  });
}


// render on page load
renderTeachers();
renderExams();
renderStudents();
</script>
</body>
</html>
